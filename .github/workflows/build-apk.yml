name: Build AI Stock Bot APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unzip Android project
        run: unzip -q AIStockBot_Android_Project.zip -d project
      - name: Build APK
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -type f -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then echo 'settings.gradle not found'; exit 1; fi
          gradle -p "$PROJECT_DIR" assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-STOCK-BOT-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
